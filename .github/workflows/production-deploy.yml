# Build a WordPress-plugin-only tree and push to the production branch.
# Uses https://github.com/code-soup/wp-plugin-production-deploy
#
# Source: master (development)
# Target: production (runtime files for zip / direct plugin install)

name: WordPress plugin production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: WordPress Plugin Production Deploy
        uses: code-soup/wp-plugin-production-deploy@v1.0.0
        with:
          node-version: "22"
          php-version: "8.2"
          build-command: npm run build:prod
          composer-install: "true"
          target-branch: production
          use-deployignore: "true"
          production-files: >-
            includes assets index.php LICENSE.txt README.md CHANGELOG.md readme.txt
